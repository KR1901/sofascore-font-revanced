name: Build Sofascore Font Patch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare ReVanced patch project
        shell: bash
        run: |
          set -euo pipefail

          VERSION="0.1.${GITHUB_RUN_NUMBER}"
          BUILD_DIR="$RUNNER_TEMP/revanced-build"

          git clone \
            --depth 1 \
            --branch v1.0.5-dev.1 \
            https://github.com/ReVanced/revanced-patches-template.git \
            "$BUILD_DIR"

          cd "$BUILD_DIR"

          # Set our patch version.
          sed -i "s/^version = .*/version = ${VERSION}/" gradle.properties

          # Patch metadata.
          cat > patches/build.gradle.kts <<'EOF'
          group = "app.revanced"

          patches {
              about {
                  name = "Sofascore Font ReVanced"
                  description = "Replaces Sofascore's bundled regular sans font with Google Sans Code NFP Regular."
                  source = "https://github.com/KR1901/sofascore-font-revanced"
                  author = "KR1901"
                  website = "https://github.com/KR1901/sofascore-font-revanced"
                  license = "GNU General Public License v3.0"
              }
          }
          EOF

          mkdir -p \
            patches/src/main/kotlin/app/revanced/patches/sofascore/font \
            patches/src/main/resources/fonts

          # Google Sans Code Nerd Font v3.5.1.
          curl -fL \
            "https://github.com/ryanoasis/nerd-fonts/releases/download/v3.5.1/GoogleSansCode.zip" \
            -o "$RUNNER_TEMP/GoogleSansCode.zip"

          mkdir -p "$RUNNER_TEMP/google-sans-code"
          unzip -q "$RUNNER_TEMP/GoogleSansCode.zip" \
            -d "$RUNNER_TEMP/google-sans-code"

          FONT="$(find "$RUNNER_TEMP/google-sans-code" \
            -type f \
            -name 'GoogleSansCodeNerdFontPropo-Regular.ttf' \
            -print -quit)"

          test -n "$FONT"
          cp "$FONT" \
            patches/src/main/resources/fonts/GoogleSansCodeNerdFontPropo-Regular.ttf

          # The actual Sofascore font patch.
          cat > patches/src/main/kotlin/app/revanced/patches/sofascore/font/GoogleSansCodeSofascoreFontPatch.kt <<'EOF'
          package app.revanced.patches.sofascore.font

          import app.revanced.patcher.patch.resourcePatch

          @Suppress("unused")
          val googleSansCodeSofascoreFontPatch = resourcePatch(
              name = "Use Google Sans Code for Sofascore",
              description = "Replaces Sofascore's bundled regular sans font with Google Sans Code NFP Regular.",
          ) {
              compatibleWith("com.sofascore.results"("26.09.14"))

              apply {
                  val target = get("res/font/sofascore_sans_regular.otf")

                  val replacement = requireNotNull(
                      object {}.javaClass.classLoader.getResourceAsStream(
                          "fonts/GoogleSansCodeNerdFontPropo-Regular.ttf"
                      )
                  ) {
                      "Replacement font resource is missing."
                  }

                  replacement.use { input ->
                      target.outputStream().use { output ->
                          input.copyTo(output)
                      }
                  }
              }
          }
          EOF

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD_DIR=$BUILD_DIR" >> "$GITHUB_ENV"

      - name: Build ReVanced patch
        working-directory: ${{ env.BUILD_DIR }}
        env:
          ORG_GRADLE_PROJECT_githubPackagesUsername: ${{ github.actor }}
          ORG_GRADLE_PROJECT_githubPackagesPassword: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew :patches:buildAndroid --no-daemon

      - name: Prepare release
        shell: bash
        run: |
          set -euo pipefail

          RVP="$(find "$BUILD_DIR/patches/build/libs" \
            -maxdepth 1 \
            -type f \
            -name '*.rvp' \
            -print -quit)"

          test -n "$RVP"

          cp "$RVP" "$GITHUB_WORKSPACE/patches-${VERSION}.rvp"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create \
            "v${VERSION}" \
            "patches-${VERSION}.rvp" \
            --repo "$GITHUB_REPOSITORY" \
            --title "v${VERSION}" \
            --notes "Sofascore 26.09.14 Google Sans Code font patch."

      - name: Publish Manager manifest
        shell: bash
        run: |
          set -euo pipefail

          cat > patches.json <<EOF
          {
            "version": "v${VERSION}",
            "created_at": "$(date -u +%Y-%m-%dT%H:%M:%S)",
            "description": "Sofascore Google Sans Code font patch.",
            "download_url": "https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/patches-${VERSION}.rvp",
            "signature_download_url": null
          }
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add patches.json
          git commit -m "build: publish Sofascore font patch v${VERSION}"
          git push origin HEAD:main
