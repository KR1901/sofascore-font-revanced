name: Build Sofascore Font Patch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build .rvp patch
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare official ReVanced template
        shell: bash
        run: |
          set -euo pipefail

          BUILD_DIR="$RUNNER_TEMP/revanced-patches"

          git clone \
            --depth 1 \
            https://github.com/ReVanced/revanced-patches-template.git \
            "$BUILD_DIR"

          mkdir -p \
            "$BUILD_DIR/patches/src/main/kotlin/app/revanced/patches/sofascore/font" \
            "$BUILD_DIR/patches/src/main/resources/fonts"

          cp \
            patches/src/main/kotlin/app/revanced/patches/sofascore/font/SofascoreFontPatch.kt \
            "$BUILD_DIR/patches/src/main/kotlin/app/revanced/patches/sofascore/font/SofascoreFontPatch.kt"

          cat > "$BUILD_DIR/patches/build.gradle.kts" <<'EOF'
          group = "app.revanced"

          patches {
              about {
                  name = "Sofascore Font ReVanced"
                  description = "Replaces Sofascore's bundled regular sans font with Google Sans Code NFP Regular."
                  source = "https://github.com/KR1901/sofascore-font-revanced"
                  author = "KR1901"
                  contact = "ranvirkr19@gmail.com"
                  website = "https://github.com/KR1901/sofascore-font-revanced"
                  license = "GNU General Public License v3.0"
              }
          }
          EOF

          curl -fL \
            "https://github.com/ryanoasis/nerd-fonts/releases/download/v3.5.1/GoogleSansCode.zip" \
            -o "$RUNNER_TEMP/GoogleSansCode.zip"

          mkdir -p "$RUNNER_TEMP/google-sans-code"

          unzip -q \
            "$RUNNER_TEMP/GoogleSansCode.zip" \
            -d "$RUNNER_TEMP/google-sans-code"

          FONT="$(find "$RUNNER_TEMP/google-sans-code" \
            -type f \
            -name 'GoogleSansCodeNerdFontPropo-Regular.ttf' \
            -print -quit)"

          test -n "$FONT"

          cp "$FONT" \
            "$BUILD_DIR/patches/src/main/resources/fonts/GoogleSansCodeNerdFontPropo-Regular.ttf"

          echo "BUILD_DIR=$BUILD_DIR" >> "$GITHUB_ENV"

      - name: Update ReVanced API declarations
        working-directory: ${{ env.BUILD_DIR }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew :patches:apiDump --no-daemon

      - name: Build ReVanced patch
        working-directory: ${{ env.BUILD_DIR }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew build --no-daemon

      - name: Find generated RVP
        shell: bash
        run: |
          set -euo pipefail

          RVP="$(find "$BUILD_DIR/patches/build/libs" \
            -maxdepth 1 \
            -type f \
            -name '*.rvp' \
            ! -name '*sources*' \
            ! -name '*javadoc*' \
            -print -quit)"

          test -n "$RVP"

          VERSION="0.1.${GITHUB_RUN_NUMBER}"

          cp "$RVP" \
            "$GITHUB_WORKSPACE/patches-${VERSION}.rvp"

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Publish RVP release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create \
            "v${VERSION}" \
            "patches-${VERSION}.rvp" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Sofascore Font Patch v${VERSION}" \
            --notes "Replaces Sofascore 26.09.14 regular sans font with Google Sans Code NFP Regular."

      - name: Create ReVanced API manifest
        shell: bash
        run: |
          set -euo pipefail

          cat > patches.json <<EOF
          {
            "version": "v${VERSION}",
            "created_at": "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)",
            "description": "Sofascore font patch: replaces the bundled regular sans font with Google Sans Code NFP Regular.",
            "download_url": "https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/patches-${VERSION}.rvp",
            "signature_download_url": null
          }
          EOF

      - name: Commit manifest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add patches.json

          git commit \
            -m "build: publish ReVanced patch manifest v${VERSION}" \
            || true

          git push origin HEAD:main
