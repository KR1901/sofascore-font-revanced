name: Build Sofascore Font Patch

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  # Pinned so builds are reproducible. Bump deliberately.
  #
  # This must be a template that targets patcher 22.x. ReVanced Manager 2.6.0
  # ships patcher 22.0.2-dev.1, which has no `ResourcePatch` class: the patch
  # API was reworked in 22.0.0 so `resourcePatch {}` returns `Patch`. Building
  # against the older template (patcher 21.x) produces a bundle whose patch
  # getter returns `ResourcePatch`, which Manager then fails to load with
  # NoClassDefFoundError. The template's `main` branch is still on 21.0.0; the
  # `dev` branch is the one on patcher 22.
  TEMPLATE_REPO: https://github.com/ReVanced/revanced-patches-template.git
  TEMPLATE_SHA: 9abc54a4ea849f1ba38c33ea1fd141bc87125d86
  # Google Sans Code upstream release and the fonttools used to pin the
  # variable font to its Regular instance.
  FONT_VERSION: v7.001
  FONTTOOLS_VERSION: "4.66.1"

jobs:
  build:
    name: Build .rvp patch
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare official ReVanced template
        shell: bash
        run: |
          set -euo pipefail

          BUILD_DIR="$RUNNER_TEMP/revanced-patches"

          git clone "$TEMPLATE_REPO" "$BUILD_DIR"
          git -C "$BUILD_DIR" checkout "$TEMPLATE_SHA"

          PATCH_DIR="$BUILD_DIR/patches/src/main/kotlin/app/revanced/patches/sofascore/font"
          FONT_DIR="$BUILD_DIR/patches/src/main/resources/fonts"

          mkdir -p "$PATCH_DIR" "$FONT_DIR"

          # Drop the template's example patch and its unused extension module so
          # they do not ship inside the bundle.
          rm -rf "$BUILD_DIR/patches/src/main/kotlin/app/revanced/patches/com"
          rm -rf "$BUILD_DIR/extensions"

          cp patches/src/main/kotlin/app/revanced/patches/sofascore/font/SofascoreFontPatch.kt \
            "$PATCH_DIR/SofascoreFontPatch.kt"

          # Google Sans Code is SIL OFL 1.1. Fetch the pinned upstream release and
          # pin the variable font to its Regular instance (wght 400, monospace).
          curl -fL \
            "https://github.com/googlefonts/googlesans-code/releases/download/${FONT_VERSION}/GoogleSansCode-Android-${FONT_VERSION}.zip" \
            -o "$RUNNER_TEMP/gsc.zip"

          mkdir -p "$RUNNER_TEMP/gsc"
          unzip -q "$RUNNER_TEMP/gsc.zip" -d "$RUNNER_TEMP/gsc"

          python3 -m pip install --quiet "fonttools==${FONTTOOLS_VERSION}"

          GSC_SRC="$RUNNER_TEMP/gsc/GoogleSansCode[MONO,wght].ttf" \
          python3 - <<'PY'
          import os
          from fontTools.ttLib import TTFont
          from fontTools.varLib import instancer

          font = TTFont(os.environ["GSC_SRC"])
          instancer.instantiateVariableFont(
              font, {"wght": 400, "MONO": 1}, inplace=False, updateFontNames=False
          ).save("GoogleSansCode-Regular.ttf")
          PY

          cp GoogleSansCode-Regular.ttf "$FONT_DIR/GoogleSansCode-Regular.ttf"

          cat > "$BUILD_DIR/patches/build.gradle.kts" <<'EOF'
          group = "app.revanced"

          patches {
              about {
                  name = "Sofascore Font ReVanced"
                  description = "Replaces Sofascore's bundled regular sans font with Google Sans Code Regular."
                  source = "https://github.com/KR1901/sofascore-font-revanced"
                  author = "KR1901"
                  contact = "ranvirkr19@gmail.com"
                  website = "https://github.com/KR1901/sofascore-font-revanced"
                  license = "GNU General Public License v3.0"
              }
          }
          EOF

          echo "BUILD_DIR=$BUILD_DIR" >> "$GITHUB_ENV"

      # The template's settings declares the ReVanced GitHub Packages repositories
      # with `credentials(PasswordCredentials::class)`, which Gradle resolves from
      # the `githubPackagesUsername` / `githubPackagesPassword` project properties.
      # Without these the gradle plugin and app.revanced:patcher cannot be resolved.
      #
      # ReVanced Manager loads patch bundles by reading DEX from them, so the
      # bundle must be built with the buildAndroid task: it runs D8 over the jar
      # and merges classes.dex in. Plain `jar` (and `build`) only packs .class
      # files, which Manager rejects with EmptyMultiDexContainerException.
      - name: Build ReVanced patch (Android bundle)
        working-directory: ${{ env.BUILD_DIR }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORG_GRADLE_PROJECT_githubPackagesUsername: ${{ github.actor }}
          ORG_GRADLE_PROJECT_githubPackagesPassword: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:buildAndroid --no-daemon

      - name: Verify bundle contents
        shell: bash
        run: |
          set -euo pipefail

          RVP="$(find "$BUILD_DIR/patches/build/libs" \
            -maxdepth 1 -type f -name '*.rvp' \
            ! -name '*sources*' ! -name '*javadoc*' -print -quit)"

          test -n "$RVP"

          echo "Bundle: $RVP"
          unzip -l "$RVP"

          # Without DEX the bundle builds fine but cannot be loaded by ReVanced
          # Manager, which then fails with EmptyMultiDexContainerException.
          # Match anywhere in the line: unzip -l pads the filename into a column.
          unzip -l "$RVP" | grep -qE 'classes[0-9]*\.dex' \
            || { echo "::error::bundle contains no DEX; ReVanced Manager cannot load it"; exit 1; }

          # Fail loudly rather than shipping template leftovers.
          if unzip -l "$RVP" | grep -qiE 'patches/(example|com)|extension\.rve'; then
            echo "::error::example patch or extension leaked into the bundle"
            exit 1
          fi

          unzip -l "$RVP" | grep -q 'app/revanced/patches/sofascore/font/.*\.class' \
            || { echo "::error::Sofascore font patch class missing from bundle"; exit 1; }

          unzip -l "$RVP" | grep -q 'fonts/GoogleSansCode-Regular.ttf' \
            || { echo "::error::font resource missing from bundle"; exit 1; }

      - name: Publish RVP release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          RVP="$(find "$BUILD_DIR/patches/build/libs" \
            -maxdepth 1 -type f -name '*.rvp' \
            ! -name '*sources*' ! -name '*javadoc*' -print -quit)"

          test -n "$RVP"

          VERSION="0.1.${GITHUB_RUN_NUMBER}"

          cp "$RVP" "$GITHUB_WORKSPACE/patches-${VERSION}.rvp"

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          gh release create "v${VERSION}" "$GITHUB_WORKSPACE/patches-${VERSION}.rvp" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Sofascore Font Patch v${VERSION}" \
            --notes "Replaces the bundled regular sans font with Google Sans Code Regular (Sofascore 26.09.14 / 26.10.12)."

      - name: Create ReVanced source manifest
        shell: bash
        run: |
          set -euo pipefail

          # created_at must be a *local* ISO datetime. ReVanced Manager deserialises
          # it into kotlinx.datetime.LocalDateTime, which rejects a trailing "Z" and
          # then reports "Failed to download patches".
          python3 - <<'PY'
          import datetime
          import json
          import os

          version = os.environ["VERSION"]
          repo = os.environ["GITHUB_REPOSITORY"]

          manifest = {
              "version": f"v{version}",
              "created_at": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%S"),
              "description": "Sofascore font patch: replaces the bundled regular sans font with Google Sans Code Regular.",
              "download_url": f"https://github.com/{repo}/releases/download/v{version}/patches-{version}.rvp",
              "signature_download_url": None,
          }

          with open("patches.json", "w") as f:
              json.dump(manifest, f, indent=2)
              f.write("\n")
          PY

          cat patches.json

      - name: Commit manifest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add patches.json

          git commit \
            -m "build: publish ReVanced patch manifest v${VERSION}" \
            || true

          git push origin HEAD:main
